<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barney | Late Night Thoughts</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: radial-gradient(circle at top, #202c52, #080b18 70%);
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow: hidden;
}

.stars {
    position: fixed;
    inset: 0;
    background-image:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(#9db8ff 1px, transparent 1px);
    background-size: 80px 80px, 120px 120px;
    background-position: 0 0, 40px 40px;
    opacity: 0.3;
    pointer-events: none;
}

.content {
    position: relative;
    z-index: 1;
    padding: 25px;
}

.artist {
    color: #a9baff;
    letter-spacing: 8px;
    font-size: 16px;
    margin-bottom: 25px;
}

h1 {
    font-size: clamp(38px, 8vw, 75px);
    letter-spacing: 3px;
    margin-bottom: 15px;
    text-shadow: 0 0 25px #718cff;
}

.subtitle {
    color: #b8c2df;
    font-size: 17px;
    margin-bottom: 40px;
}

.countdown {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
}

.box {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 15px;
    padding: 20px;
    min-width: 85px;
    backdrop-filter: blur(10px);
}

.number {
    font-size: 35px;
    font-weight: bold;
}

.label {
    color: #a9baff;
    font-size: 11px;
    margin-top: 8px;
    letter-spacing: 2px;
}

.footer {
    margin-top: 45px;
    color: #8996bb;
    font-size: 13px;
    letter-spacing: 2px;
}

</style>
</head>

<body>

<div class="stars"></div>

<div class="content">

    <div class="artist">BARNEY</div>

    <h1>LATE NIGHT<br>THOUGHTS</h1>

    <p class="subtitle">A new song is coming...</p>

    <div class="countdown" id="countdown">

        <div class="box">
            <div class="number" id="days">00</div>
            <div class="label">DAYS</div>
        </div>

        <div class="box">
            <div class="number" id="hours">00</div>
            <div class="label">HOURS</div>
        </div>

        <div class="box">
            <div class="number" id="minutes">00</div>
            <div class="label">MINUTES</div>
        </div>

        <div class="box">
            <div class="number" id="seconds">00</div>
            <div class="label">SECONDS</div>
        </div>

    </div>

    <div class="footer" id="footer">
        OUT 1 NOVEMBER · 12:00 PM UK TIME
    </div>

</div>

<script>

const releaseDate = new Date("2026-11-01T12:00:00+00:00").getTime();

function updateCountdown() {

    const now = Date.now();
    const distance = releaseDate - now;

    if (distance <= 0) {
        document.getElementById("countdown").innerHTML =
            "<h2>OUT NOW! 🎵</h2>";

        document.getElementById("footer").innerText =
            "LATE NIGHT THOUGHTS · BARNEY";

        return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((distance / (1000 * 60)) % 60);
    const seconds = Math.floor((distance / 1000) % 60);

    document.getElementById("days").innerText = days;
    document.getElementById("hours").innerText = hours;
    document.getElementById("minutes").innerText = minutes;
    document.getElementById("seconds").innerText = seconds;

}

updateCountdown();
setInterval(updateCountdown, 1000);

</script>

</body>
</html>
