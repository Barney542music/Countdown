<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BARNEY | LATE NIGHT THOUGHTS</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: radial-gradient(circle at top, #202c52, #080b18 75%);
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow-x: hidden;
}

.stars {
    position: fixed;
    inset: 0;
    background-image:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(#9db8ff 1px, transparent 1px);
    background-size: 80px 80px, 120px 120px;
    background-position: 0 0, 40px 40px;
    opacity: 0.3;
    pointer-events: none;
}

.content {
    position: relative;
    z-index: 1;
    padding: 35px 20px;
    width: 100%;
}

.artist {
    color: #a9baff;
    letter-spacing: 9px;
    font-size: 17px;
    margin-bottom: 20px;
}

h1 {
    font-size: clamp(38px, 8vw, 75px);
    letter-spacing: 3px;
    margin-bottom: 15px;
    text-shadow: 0 0 25px #718cff;
}

.subtitle {
    color: #b8c2df;
    font-size: 17px;
    margin-bottom: 25px;
}

#cover {
    width: 280px;
    max-width: 85%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
    margin: 25px auto 35px;
    border-radius: 8px;
    opacity: 0;
    transition: opacity 1s ease;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}

.countdown {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
}

.box {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 15px;
    padding: 18px;
    min-width: 80px;
    backdrop-filter: blur(10px);
}

.number {
    font-size: 32px;
    font-weight: bold;
}

.label {
    color: #a9baff;
    font-size: 10px;
    margin-top: 8px;
    letter-spacing: 2px;
}

.footer {
    margin-top: 35px;
    color: #8996bb;
    font-size: 12px;
    letter-spacing: 2px;
}

</style>
</head>

<body>

<div class="stars"></div>

<div class="content">

    <div class="artist">BARNEY</div>

    <h1>LATE NIGHT<br>THOUGHTS</h1>

    <p class="subtitle" id="subtitle">
        A new song is coming...
    </p>

    <img
        id="cover"
        src="cover.png"
        alt="Late Night Thoughts album cover"
    >

    <div class="countdown" id="countdown">

        <div class="box">
            <div class="number" id="days">00</div>
            <div class="label">DAYS</div>
        </div>

        <div class="box">
            <div class="number" id="hours">00</div>
            <div class="label">HOURS</div>
        </div>

        <div class="box">
            <div class="number" id="minutes">00</div>
            <div class="label">MINUTES</div>
        </div>

        <div class="box">
            <div class="number" id="seconds">00</div>
            <div class="label">SECONDS</div>
        </div>

    </div>

    <div class="footer" id="footer">
        OUT 1 NOVEMBER · 12:00 PM UK TIME
    </div>

</div>

<script>

// RELEASE DATE: 1 NOVEMBER 2026 AT 12 PM UK TIME
const releaseDate =
    new Date("2026-11-01T12:00:00+00:00").getTime();

// COVER REVEAL STARTS: 31 OCTOBER AT MIDNIGHT
const revealStart =
    new Date("2026-10-31T00:00:00+00:00").getTime();

// COVER FULLY VISIBLE: 1 NOVEMBER AT 10 AM
const revealEnd =
    new Date("2026-11-01T10:00:00+00:00").getTime();


function updateWebsite() {

    const now = Date.now();

    // GRADUALLY REVEAL THE COVER
    let progress = (now - revealStart) /
                   (revealEnd - revealStart);

    progress = Math.max(0, Math.min(1, progress));

    document.getElementById("cover").style.opacity = progress;


    // UPDATE COUNTDOWN
    const distance = releaseDate - now;

    if (distance <= 0) {

        document.getElementById("countdown").innerHTML =
            "<h2>OUT NOW! 🎵</h2>";

        document.getElementById("subtitle").innerText =
            "LATE NIGHT THOUGHTS IS FINALLY HERE!";

        document.getElementById("footer").innerText =
            "BARNEY · LATE NIGHT THOUGHTS";

        return;
    }

    const days = Math.floor(
        distance / (1000 * 60 * 60 * 24)
    );

    const hours = Math.floor(
        (distance / (1000 * 60 * 60)) % 24
    );

    const minutes = Math.floor(
        (distance / (1000 * 60)) % 60
    );

    const seconds = Math.floor(
        (distance / 1000) % 60
    );

    document.getElementById("days").innerText =
        String(days).padStart(2, "0");

    document.getElementById("hours").innerText =
        String(hours).padStart(2, "0");

    document.getElementById("minutes").innerText =
        String(minutes).padStart(2, "0");

    document.getElementById("seconds").innerText =
        String(seconds).padStart(2, "0");
}


// UPDATE EVERY SECOND
updateWebsite();
setInterval(updateWebsite, 1000);

</script>

</body>
</html>
